version: 2.1

orbs:
  gcp-cli: circleci/gcp-cli@3.3.2

jobs:
  prepare:
    executor: gcp-cli/google
    steps:
      - run: mkdir private-keys
      - run: "echo ${DELIVERY_TEAM_SECRET_ACCESSOR_KEY} | base64 -d -i > gcloud-service-key.json"
      - run: gcloud auth activate-service-account --key-file gcloud-service-key.json
      - run: gcloud config set project private-keys-362314
      - run: gcloud secrets versions access latest --secret="SERVICES_PROJECT_SERVICE_ACCOUNT" > private-keys/services.json
      - persist_to_workspace:
          root: .
          paths:
            - private-keys

  build:
    docker: &DOCKERIMAGE
      - image: cimg/openjdk:17.0.8
    working_directory: ~/client-side-events

    steps:
      - checkout
      - restore_cache:
          key: client-side-events-{{ checksum "pom.xml" }}
      - run: mvn dependency:go-offline
      - run: mvn clean package
      - save_cache:
          paths:
            - ~/.m2
          key: client-side-events-{{ checksum "pom.xml" }}

  deploy_stage:
    docker: *DOCKERIMAGE
    working_directory: ~/client-side-events
    steps:
      - gcp-cli/install:
          version: latest
      - checkout
      - restore_cache:
          key: client-side-events-{{ checksum "pom.xml" }}
      - attach_workspace:
          at: ~/
      - run:
          name: Authenticate with GCloud
          command: |
            gcloud auth activate-service-account --key-file=../private-keys/services.json
            gcloud config set project $PROJECT_ID
      - run:
          name: Deploy
          command: |
            mvn clean package appengine:deploy -DskipTests -Dapp.deploy.version=stage -Dapp.deploy.projectId=client-side-events

  deploy_prod:
    docker: *DOCKERIMAGE
    working_directory: ~/client-side-events
    steps:
      - gcp-cli/install:
          version: latest
      - checkout
      - restore_cache:
          key: client-side-events-{{ checksum "pom.xml" }}
      - attach_workspace:
          at: ~/
      - run:
          name: Authenticate with GCloud
          command: |
            gcloud auth activate-service-account --key-file=../private-keys/services.json
            gcloud config set project $PROJECT_ID
      - run:
          name: Deploy
          command: |
            mvn clean package appengine:deploy -DskipTests -Dapp.deploy.version=r$(echo -n $((CIRCLE_BUILD_NUM%10))) -Dapp.deploy.promote=true -Dapp.deploy.projectId=client-side-events

workflows:
  build_and_deploy:
    jobs:
      - prepare:
          context:
            - team-secret-accessors
      - build
      - deploy_stage:
          requires:
            - prepare
            - build
          filters:
            branches:
              ignore:
                - master
      - deploy_prod:
          requires:
            - prepare
            - build
          filters:
            branches:
              only:
                - master